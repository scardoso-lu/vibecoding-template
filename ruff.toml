# Root-level lint config for scripts/ only. Stack-local code gets its own
# backend/pyproject.toml (and frontend tooling) once the app is scaffolded;
# ruff prefers the closest config to the invocation directory, so this file
# never affects those.

[lint.per-file-ignores]
# scripts/validate/cli.py and scripts/test_validate/*.py insert the repo root
# on sys.path before importing `scripts.*`, so Python can resolve the package
# when the file is run directly (`python scripts/validate/cli.py ...`) or via
# direct pytest collection. That sys.path insert must precede the import, which
# trips E402 on a pattern that is required here, not accidental.
"scripts/validate/*.py" = ["E402"]
"scripts/test_validate/*.py" = ["E402"]
